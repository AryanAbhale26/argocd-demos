apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: chatino
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend-deployment
  template:
    metadata:
      labels:
        app: frontend-deployment
    spec:
      containers:
          - name: frontend
            image: aryanabhale/chatino-frontend:latest
            ports: 
            - containerPort: 8080    
